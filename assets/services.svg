<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t">
  <title id="t">What I do: Business automation, AI workflows, Web development, SEO and digital marketing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140810"/><stop offset="1" stop-color="#2a0b1b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0f24"/><stop offset="1" stop-color="#1a0810"/></linearGradient>
    <g id="c"><rect width="264" height="220" rx="14" fill="url(#card)" stroke="#7a1a44"/></g>
  </defs>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; } .mono { font-family: ui-monospace, Consolas, monospace; }
    .k { animation: up .8s ease-out both; } .k2 { animation-delay: .15s; } .k3 { animation-delay: .3s; } .k4 { animation-delay: .45s; }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
    @keyframes glow { 50% { stroke-opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .k, .glow { animation: none; } }
    .h { font-size: 26px; fill: #fdf2f8; } .p { font-size: 15px; fill: #c9a3b6; } .n { font-size: 12px; fill: #e0267a; letter-spacing: 2px; }
  </style>
  <rect x=".5" y=".5" width="1199" height="399" rx="18" fill="url(#bg)" stroke="#5c1430"/>
