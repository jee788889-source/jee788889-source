<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
  <title id="t">Ali Hamza. — Business automation, AI workflows, web</title>
  <desc id="d">Dark crimson hero card with the name Ali Hamza. in large serif type, a tagline, service chips, and an original anime-style avatar inside a glowing ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0509"/>
      <stop offset=".55" stop-color="#2a0b1b"/>
      <stop offset="1" stop-color="#4a0f2c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#5c1430"/><stop offset=".5" stop-color="#e0267a"/><stop offset="1" stop-color="#5c1430"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0267a" stop-opacity=".55"/><stop offset="1" stop-color="#e0267a" stop-opacity="0"/></radialGradient>
    <radialGradient id="disc" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#3a0f24"/><stop offset="1" stop-color="#12060c"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f9a8d4" opacity=".08"/></pattern>
    <clipPath id="c"><rect width="1200" height="460" rx="20"/></clipPath>
  </defs>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    .spin { transform-origin: 960px 230px; animation: spin 14s linear infinite; }
    .rev { transform-origin: 960px 230px; animation: spin 22s linear infinite reverse; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    .sheen { animation: sheen 7s ease-in-out infinite; }
    .up { animation: up .9s ease-out both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
    @keyframes pulse { 50% { opacity: .45; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sheen { 0%,100% { transform: translateX(-300px); } 50% { transform: translateX(1400px); } }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
    <circle class="pulse" cx="960" cy="230" r="260" fill="url(#glow)"/>
    <g transform="skewX(-18)"><rect class="sheen" x="0" y="0" width="120" height="460" fill="#fff" opacity=".035"/></g>

    <rect x="56" y="48" width="300" height="30" rx="15" fill="#000" fill-opacity=".35" stroke="#5c1430"/>
    <circle class="pulse" cx="76" cy="63" r="4" fill="#e0267a"/>
    <text x="90" y="68" class="mono" font-size="13" fill="#f9a8d4" letter-spacing="1">~/automation · ai · web</text>

    <g class="up"><text x="56" y="128" class="mono" font-size="13" fill="#b48a9d" letter-spacing="3">01 · AUTOMATION · AI WORKFLOWS · WEB · SEO</text></g>
    <g class="up d1"><text x="50" y="250" class="serif" font-size="112" fill="#fdf2f8">Ali Hamza<tspan class="blink" fill="#e0267a">.</tspan></text></g>
    <g class="up d2"><text x="56" y="300" class="serif" font-style="italic" font-size="26" fill="#f5d0e2">Automating busywork. Building systems that run themselves.</text></g>

    <g class="up d3 mono" font-size="13" letter-spacing="1">
      <rect x="56" y="350" width="214" height="36" rx="8" fill="#e0267a"/><text x="74" y="373" fill="#fff">BUSINESS AUTOMATION</text>
      <rect x="282" y="350" width="150" height="36" rx="8" fill="none" stroke="#e0267a"/><text x="300" y="373" fill="#f9a8d4">AI WORKFLOWS</text>
      <rect x="444" y="350" width="104" height="36" rx="8" fill="none" stroke="#e0267a"/><text x="462" y="373" fill="#f9a8d4">WEB DEV</text>
      <rect x="560" y="350" width="64" height="36" rx="8" fill="none" stroke="#e0267a"/><text x="578" y="373" fill="#f9a8d4">SEO</text>
    </g>

    <circle class="spin" cx="960" cy="230" r="142" fill="none" stroke="url(#edge)" stroke-width="3" stroke-dasharray="210 90" stroke-linecap="round"/>
    <circle class="rev" cx="960" cy="230" r="160" fill="none" stroke="#f9a8d4" stroke-opacity=".35" stroke-dasharray="2 10"/>
    <svg x="836" y="106" width="248" height="248" viewBox="0 0 400 400"><defs>
    <radialGradient id="bgA" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#5a1236"/><stop offset="1" stop-color="#12060c"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d9c6"/><stop offset="1" stop-color="#e6b39a"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1428"/><stop offset="1" stop-color="#170910"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0a18"/><stop offset="1" stop-color="#2a1640"/></linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a0d33"/><stop offset=".6" stop-color="#d61f6f"/><stop offset="1" stop-color="#ff7ab8"/></linearGradient>
    <clipPath id="circ"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
  <style>
    .eyes { transform-origin: 200px 224px; animation: blink 5s infinite; }
    .glow { animation: glow 2.6s ease-in-out infinite; }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes glow { 50% { opacity: .35; } }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#circ)">
    <rect width="400" height="400" fill="url(#bgA)"/>
    <g class="bob">
      <!-- hoodie -->
      <path d="M30 420 C40 322 110 292 200 292 C290 292 360 322 370 420 Z" fill="url(#hood)"/>
      <path d="M30 420 C40 322 110 292 200 292 C290 292 360 322 370 420" fill="none" stroke="#e0267a" stroke-opacity=".6" stroke-width="2.5"/>
      <path d="M150 296 Q200 336 250 296" fill="none" stroke="#e0267a" stroke-width="3"/>
      <path d="M178 316 V376 M222 316 V376" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"/>
      <!-- neck -->
      <path d="M176 258 H224 V304 Q200 314 176 304 Z" fill="#d9a088"/>
      <path d="M176 270 Q200 284 224 270" fill="none" stroke="#c58b74" stroke-width="3"/>
      <!-- angular male face -->
      <path d="M136 176 C136 128 264 128 264 176 L262 220 C258 246 236 274 200 282 C164 274 142 246 138 220 Z" fill="url(#skin)"/>
      <!-- ears -->
      <path d="M138 206 C124 200 122 228 140 234 M262 206 C276 200 278 228 260 234" fill="#e6b39a"/>
      <!-- spiky hair -->
      <path d="M124 196 C108 150 118 100 152 80 L146 62 L178 74 L186 46 L208 70 L232 44 L238 74 L270 60 L262 88 C290 108 296 150 278 196 L268 160 L256 180 L248 140 L226 172 L216 132 L196 168 L184 132 L166 170 L156 140 L144 178 Z" fill="url(#hair)"/>
      <path d="M170 92 C190 82 222 82 244 96" fill="none" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      <!-- thick straight brows -->
      <path d="M152 200 L186 196 M214 196 L248 200" stroke="#120a16" stroke-width="6" stroke-linecap="round"/>
      <!-- sharp eyes -->
      <g class="eyes">
        <path d="M152 222 Q168 210 188 218 Q172 234 152 222 Z" fill="#fff"/>
        <path d="M212 218 Q232 210 248 222 Q228 234 212 218 Z" fill="#fff"/>
        <ellipse cx="171" cy="222" rx="8" ry="9" fill="url(#iris)"/>
        <ellipse cx="229" cy="222" rx="8" ry="9" fill="url(#iris)"/>
        <circle cx="171" cy="223" r="3.5" fill="#1a0610"/><circle cx="229" cy="223" r="3.5" fill="#1a0610"/>
        <circle cx="168" cy="219" r="2.4" fill="#fff"/><circle cx="226" cy="219" r="2.4" fill="#fff"/>
        <path d="M150 221 Q168 206 190 217 M210 217 Q232 206 250 221" fill="none" stroke="#120a16" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <!-- nose, mouth -->
      <path d="M201 232 L196 250 L204 251" fill="none" stroke="#c58b74" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M186 264 Q200 270 216 263" fill="none" stroke="#9c5450" stroke-width="2.6" stroke-linecap="round"/>
      <!-- headphones -->
      <path d="M118 212 C106 104 294 104 282 212" fill="none" stroke="#1f1424" stroke-width="12" stroke-linecap="round"/>
      <rect x="102" y="196" width="36" height="60" rx="14" fill="#1f1424" stroke="#e0267a" stroke-width="2"/>
      <rect x="262" y="196" width="36" height="60" rx="14" fill="#1f1424" stroke="#e0267a" stroke-width="2"/>
      <rect class="glow" x="112" y="212" width="16" height="28" rx="6" fill="#e0267a"/>
      <rect class="glow" x="272" y="212" width="16" height="28" rx="6" fill="#e0267a"/>
    </g>
    <circle cx="200" cy="200" r="196" fill="none" stroke="#e0267a" stroke-opacity=".35" stroke-width="6"/>
  </g>
</svg>
  </g>
  <rect x=".5" y=".5" width="1199" height="459" rx="20" fill="none" stroke="url(#edge)" stroke-opacity=".7"/>
</svg>
